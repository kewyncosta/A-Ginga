<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Mangás</title>

  <!-- FAVICON E ÍCONE DA ABA (icon01.png) -->
  <link rel="icon" type="image/png" href="../images/icon01.png">
  <link rel="apple-touch-icon" href="../images/icon01.png">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TELA DE ABERTURA (SPLASH SCREEN COM ICON02.PNG) -->
  <div id="splash-screen" class="splash-overlay">
    <img src="../images/icon02.png" alt="Carregando..." class="splash-image">
  </div>

  <div id="splash-screen" class="splash-overlay">
    <picture class="splash-picture">
      <source media="(max-width: 768px)" srcset="../images/icon03.png">
      <img src="../images/icon02.png" alt="Carregando..." class="splash-image">
    </picture>
  </div>

  <!-- TELA 1: LOGIN COM GOOGLE OU VISITANTE -->
  <div id="welcome-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>SEJA BEM-VINDO</h2>
      <p>Escolha como deseja acessar a leitura:</p>
      
      <div class="modal-actions">
        <button id="save-user-btn" class="btn-google">ENTRAR COM GOOGLE 🚀</button>
        <button id="guest-btn" class="btn-guest">ENTRAR COMO VISITANTE 👤</button>
      </div>
    </div>
  </div>

  <!-- TELA 2: ABA DE SELEÇÃO DE LIVROS (IGUAL AO APLICATIVO) -->
  <div id="continue-modal" class="modal-overlay hidden">
    <div class="modal-box modal-shelf">
      <h1 class="header-title">ESCOLHA SEU MANGÁ</h1>

      <!-- SEÇÃO CONTINUAR LENDO (IGUAL AO APP) -->
      <div id="continue-reading-section" class="continue-section hidden">
        <h2 class="section-title">CONTINUAR LENDO 📖</h2>
        <div class="continue-card">
          <img src="../images/capa-a-ging.jpeg" alt="Capa A Ginga" class="cover-image-small" onerror="this.src='https://via.placeholder.com/70x100?text=A+Ginga'">
          <div class="card-info">
            <h3 class="manga-title">A GINGA</h3>
            <p id="progress-status" class="progress-text">Parou na Página 1</p>
            <button id="continue-btn" class="btn-continue">RETOMAR ▶</button>
          </div>
        </div>
      </div>

      <!-- SEÇÃO BIBLIOTECA -->
      <h2 class="section-title">BIBLIOTECA</h2>
      <div class="books-shelf">
        <div class="book-card">
          <img src="../images/capa-a-ging.jpeg" alt="Capa A Ginga" class="cover-image" onerror="this.src='https://via.placeholder.com/90x130?text=A+Ginga'">
          <div class="card-info">
            <h3 class="manga-title">A GINGA VOLUME 1</h3>
            <span class="chapter-tag">Capítulo 1</span>
            <button id="start-from-beginning-btn" class="btn-start">COMEÇAR DO INÍCIO ▶</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- LEITOR PRINCIPAL DE MANGÁ -->
  <header class="reader-header">
    <button id="back-to-home-btn" class="btn-back">← Início</button>
    <div class="manga-title-wrapper">
      <h1 class="manga-title">A GINGA</h1>
    </div>
    <button id="theme-toggle-btn" class="theme-btn">☀️ Modo Claro</button>
  </header>

  <!-- LAYOUT APENAS COM TEXTO -->
  <main class="manga-layout" id="swipe-area">
    <aside class="text-panel">
      <h2>TRANSCRIÇÃO DO CAPÍTULO</h2>
      <div id="page-text" class="text-content">
        <!-- O texto do capítulo/página aparecerá aqui -->
      </div>
    </aside>
  </main>

  <nav class="controls">
    <button id="next-btn" class="ninja-btn">◀ Anterior</button>
    <div class="scroll-counter">
      <span id="page-num">1</span> / <span id="total-pages">0</span>
    </div>
    <button id="prev-btn" class="ninja-btn">Próxima ▶</button>
  </nav>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Script Principal -->
  <script src="../js/script.js"></script>
</body>
</html>
