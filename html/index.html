<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Mangás - A Ginga</title>

  <!-- FAVICON E ÍCONE DA ABA -->
  <link rel="icon" type="image/png" href="../images/icon01.png">
  <link rel="apple-touch-icon" href="../images/icon01.png">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TELA DE ABERTURA RESPONSIVA -->
  <div id="splash-screen" class="splash-overlay">
    <picture class="splash-picture">
      <source media="(max-width: 768px)" srcset="../images/icon03.png">
      <img src="../images/icon02.png" alt="Carregando..." class="splash-image">
    </picture>
  </div>

  <!-- TELA 1: LOGIN COM GOOGLE OU VISITANTE -->
  <div id="welcome-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2>SEJA BEM-VINDO</h2>
      <p>Escolha como deseja acessar a leitura:</p>
      
      <div class="modal-actions">
        <button id="save-user-btn" class="btn-google">ENTRAR COM GOOGLE 🚀</button>
        <button id="guest-btn" class="btn-guest">ENTRAR COMO VISITANTE 👤</button>
      </div>
    </div>
  </div>

  <!-- TELA 2: ABA DE SELEÇÃO DE LIVROS -->
  <div id="continue-modal" class="modal-overlay hidden">
    <div class="modal-box modal-shelf">
      <h1 class="header-title">ESCOLHA SEU MANGÁ</h1>

      <!-- SEÇÃO CONTINUAR LENDO (GERADA DINAMICAMENTE) -->
      <div id="continue-reading-section" class="continue-section hidden">
        <h2 class="section-title">CONTINUAR LENDO 📖</h2>
        <div class="continue-list">
          <!-- Os cards dos volumes iniciados serão inseridos automaticamente aqui pelo JS -->
        </div>
      </div>

      <!-- SEÇÃO BIBLIOTECA -->
      <h2 class="section-title">Mangás Disponíveis</h2>
      <div class="books-shelf">
        
        <!-- CARD VOLUME 1 -->
        <div class="book-card">
          <img src="../images/capa_v1.png" alt="Capa A Ginga Vol 1" class="cover-image" onerror="this.src='https://via.placeholder.com/90x130?text=Vol+1'">
          <div class="card-info">
            <h3 class="manga-title">A GINGA - VOL. 1</h3>
            <span class="chapter-tag">Volume 1</span>
            <button class="btn-start" onclick="selecionarManga('jinga1')">COMEÇAR A LER ▶</button>
          </div>
        </div>

        <!-- CARD VOLUME 2 -->
        <div class="book-card">
          <img src="../images/capa_v2.png" alt="Capa A Ginga Vol 2" class="cover-image" onerror="this.src='https://via.placeholder.com/90x130?text=Vol+2'">
          <div class="card-info">
            <h3 class="manga-title">A GINGA - VOL. 2</h3>
            <span class="chapter-tag">Volume 2</span>
            <button class="btn-start" onclick="selecionarManga('jinga2')">COMEÇAR A LER ▶</button>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- LEITOR PRINCIPAL DE MANGÁ -->
  <header class="reader-header">
    <button id="back-to-home-btn" class="btn-back">← Início</button>
    <div class="manga-title-wrapper">
      <h1 id="reader-manga-title" class="manga-title">A GINGA</h1>
    </div>
    
    <!-- GRUPO DE BOTÕES DE AÇÃO NO CABEÇALHO -->
    <div class="header-actions">
      <button id="toggle-media-btn" class="theme-btn">🖼️ Imagem</button>
      <button id="theme-toggle-btn" class="theme-btn">☀️ Modo Claro</button>
    </div>
  </header>

  <!-- LAYOUT DE LEITURA (TEXTO OU IMAGEM) -->
  <main class="manga-layout" id="swipe-area">
    <aside class="text-panel">
      
      <!-- CONTÊINER DO TEXTO -->
      <div id="page-text" class="text-content">
        <!-- O texto do capítulo/página aparecerá aqui -->
      </div>

      <!-- CONTÊINER DA IMAGEM (Inicia oculto) -->
      <div id="page-image-wrapper" class="image-content hidden">
        <img id="page-image" src="" alt="Imagem da página">
      </div>
    </aside>
  </main>

  <nav class="controls">
    <button id="next-btn" class="ninja-btn">◀ Anterior</button>
    <div class="scroll-counter">
      <span id="page-num">1</span> / <span id="total-pages">0</span>
    </div>
    <button id="prev-btn" class="ninja-btn">Próxima ▶</button>
  </nav>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Script Principal -->
  <script src="../js/script.js"></script>
</body>
</html>
