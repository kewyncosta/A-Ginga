<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- TÍTULO DA ABA -->
  <title>Mangá</title>

  <!-- FAVICON CORRETO -->
  <link rel="icon" type="image/x-icon" href="../favicon.ico">
  <link rel="icon" type="image/png" href="../favicon-96x96.png">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="preconnect" href="../https://fonts.googleapis.com">
  <link rel="preconnect" href="../https://fonts.gstatic.com" crossorigin>
  <link href="../https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>

  <!-- TELA 1: LOGIN COM GOOGLE OU VISITANTE -->
  <div id="welcome-modal" class="modal-overlay">
    <div class="modal-box">
      <h2>SEJA BEM-VINDO</h2>
      <p>Escolha como deseja acessar a leitura:</p>
      
      <div class="modal-actions">
        <button id="save-user-btn" class="btn-google">ENTRAR COM GOOGLE 🚀</button>
        <button id="guest-btn" class="btn-guest">ENTRAR COMO VISITANTE 👤</button>
      </div>
    </div>
  </div>

  <!-- TELA 2: ABA DE SELEÇÃO DE LIVROS -->
  <div id="continue-modal" class="modal-overlay hidden">
    <div class="modal-box modal-shelf">
      <h2 id="welcome-user-text">OLÁ!</h2>
      <p>Qual livro você quer ler?</p>
      
      <!-- ESTANTE DE LIVROS -->
      <div class="books-shelf">
        
        <!-- CARD DO LIVRO: A GINGA -->
        <div class="book-card">
          <div class="cover-wrapper">
            <img src="../images/capa-a-ging.jpeg" alt="Capa A Ginga" class="book-cover" onerror="this.src='https://via.placeholder.com/150x220?text=Capa+A+Ginga'">
          </div>
          <div class="book-info">
            <h3>A GINGA</h3>
            <span class="chapter-tag">Capítulo 1</span>
            <p id="progress-status">Carregando...</p>
            <button id="continue-btn" class="ninja-btn">LER AGORA ▶</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- LEITOR PRINCIPAL DE MANGÁ -->
  <header>
    <div class="manga-title-wrapper">
      <h1 class="manga-title">A GINGA</h1>
      <span class="clan-tag">CLÃ GINGA</span>
    </div>
  </header>

  <main class="manga-layout">
    <div class="page-container" id="swipe-area">
      <img id="manga-page" class="manga-page" src="" alt="Página do Mangá A Ginga">
    </div>

    <aside class="text-panel">
      <h2>TRANSCRIÇÃO DO CAPÍTULO</h2>
      <div id="page-text" class="text-content">
        <!-- O texto da página aparecerá aqui -->
      </div>
    </aside>
  </main>

  <nav class="controls">
    <button id="next-btn" class="ninja-btn">◀ Anterior</button>
    <div class="scroll-counter">
      <span id="page-num">1</span> / <span id="total-pages">0</span>
    </div>
    <button id="prev-btn" class="ninja-btn">Próxima ▶</button>
  </nav>

  <!-- SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Script Principal -->
  <script src="../js/script.js"></script>
</body>
</html>
